services:
  backend:
    build: ./backend
    container_name: poultry-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/poultry_iot.db
      - UPLOAD_DIR=./uploads
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - JWT_SECRET_KEY=change-this-dev-secret
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - ./scripts:/app/scripts:ro
      - ./reports:/app/reports
      - ./simulator/sample_images:/app/simulator/sample_images:ro
      - ./backend/app/ai_model/model:/app/app/ai_model/model:ro
    depends_on:
      - mosquitto

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: poultry-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: poultry-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  backend_data:
  backend_uploads:
